<div class="bg-[#f1f2f4] p-4 rounded w-80">
  @if (isEditingTitle()) {
    <input
      #titleInput
      class="w-full text-lg font-bold mb-2 text-black bg-white rounded px-1 shadow-[inset_0_0_0_1px_#8590A2] outline-none"
      type="text"
      aria-label="List title"
      maxlength="255"
      [formControl]="titleControl"
      (keydown.enter)="saveTitle()"
      (keydown.escape)="cancelEditingTitle()"
      (blur)="saveTitle()"
    />
  } @else {
    <h2 class="text-lg font-bold capitalize mb-2 text-black">
      <button
        type="button"
        class="w-full text-left cursor-pointer capitalize"
        aria-label="Edit list title"
        (click)="startEditingTitle()"
      >{{ listTitle }}</button>
    </h2>
  }
  @if (titleError()) {
    <p class="text-red-600 text-[14px] mb-2" role="alert">Couldn't rename this list.</p>
  }
  
  <div
    cdkDropList
    [cdkDropListData]="cards"
    class="example-list"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (card of cards; track card) {
      <app-taskcard [card]="card"></app-taskcard>
    } @empty {
      <div class="text-gray-400 italic">No items</div>
    }
  </div>
  <app-add-card
    [listId]="listId"
    (cardAdded)="onCardAdded($event)"
  ></app-add-card>
  </div>
