<div class="bg-[#f1f2f4] p-4 rounded w-80">
  <h2 class="text-lg font-bold capitalize mb-2 text-black">{{ listTitle }}</h2>
  
  <div
    cdkDropList
    [cdkDropListData]="cards"
    class="example-list"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (card of cards; track card) {
      <app-taskcard [cardTitle]="card"></app-taskcard>
    } @empty {
      <div class="text-gray-400 italic">No items</div>
    }
  </div>
  </div>
