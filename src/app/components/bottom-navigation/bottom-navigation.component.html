<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
  <div class="flex items-center gap-1 rounded-2xl bg-white p-1 shadow-lg">

    <button class="flex items-center gap-2 rounded-xl px-4 py-2 text-slate-600 hover:bg-slate-100 transition">
      <lucide-icon [img]="icons.Inbox" class="h-5 w-5"></lucide-icon>
      <span>Inbox</span>
    </button>

    <button class="flex items-center gap-2 rounded-xl px-4 py-2 text-slate-600 hover:bg-slate-100 transition">
      <lucide-icon [img]="icons.Calendar" class="h-5 w-5"></lucide-icon>
      <span>Planner</span>
    </button>

    <button class="flex items-center gap-2 rounded-xl bg-blue-50 px-4 py-2 text-blue-600">
      <lucide-icon [img]="icons.KanbanSquare" class="h-5 w-5"></lucide-icon>
      <span>Board</span>
    </button>

    <button class="flex items-center gap-2 rounded-xl px-4 py-2 text-slate-600 hover:bg-slate-100 transition">
      <lucide-icon [img]="icons.ArrowRightLeft" class="h-5 w-5"></lucide-icon>
      <span>Switch boards</span>
    </button>

  </div>
</div>
