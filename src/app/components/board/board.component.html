<div class="app-layout">
  <app-navbar class="navbar"></app-navbar>
  <!-- <app-sidebar class="sidebar"></app-sidebar> -->
  <div class="main mt-3 ml-3">
    <div class="mb-3">
      <button
        type="button"
        class="rounded bg-white/90 px-3 py-1 text-[14px] font-[500] text-[#172B4D] hover:bg-white cursor-pointer"
        (click)="openShareDialog()"
      >
        Share
      </button>
    </div>
    @if (moveError()) {
      <p class="mb-3 text-red-400 text-[14px]" role="alert">Couldn't save the card's new position. The board was reloaded.</p>
    }
    <div class="flex flex-row gap-5">
      <div class="flex flex-row gap-5" cdkDropListGroup>
        @for (list of lists; track list.listId) {
        <app-list
          [listId]="list.listId"
          [listTitle]="list.listName"
          [cards]="list.cards"
          (dropped)="onListDrop($event)"
        ></app-list>
        }
      </div>
      <app-add-list
        [boardId]="boardId"
        (listAdded)="onListAdded($event)"
      ></app-add-list>
      <app-bottom-navigation class="bottom-navigation"></app-bottom-navigation>
    </div>
  </div>
</div>
