<div class="w-[400px] max-w-[calc(100vw-32px)]">
  <header class="flex justify-between items-center min-h-[56px] px-5 border-b-[1px] border-(--modal-border)">
    <h2 class="font-[600] text-[16px]">Create board</h2>
    <button
      type="button"
      aria-label="Close"
      class="rounded p-1 hover:bg-(--modal-control-hover) cursor-pointer"
      (click)="close()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
        <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
      </svg>
    </button>
  </header>

  <form class="p-5 flex flex-col gap-2" (submit)="$event.preventDefault(); create()">
    <label for="board-name" class="text-[14px] font-[600]">Board name</label>
    <!-- cdkFocusInitial: the dialog opens with the cursor already in the field -->
    <input
      id="board-name"
      type="text"
      autocomplete="off"
      cdkFocusInitial
      [maxlength]="maxLength"
      placeholder="e.g. Home renovation"
      class="rounded bg-(--modal-field) border-1 border-(--modal-border) px-2 py-1.5 text-[14px] outline-none focus:border-[#669df1]"
      [formControl]="nameControl"
    />
    @if (error()) {
      <p class="text-red-400 text-[14px]" role="alert">{{ error() }}</p>
    }
    <div class="mt-3 flex justify-end gap-2">
      <button
        type="button"
        class="text-[14px] rounded font-[500] px-3 py-1.5 cursor-pointer hover:bg-(--modal-control)"
        (click)="close()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="bg-[#0C66E4] text-white text-[14px] font-[500] rounded px-3 py-1.5 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="!nameControl.value.trim() || isCreating()"
      >
        {{ isCreating() ? 'Creating…' : 'Create' }}
      </button>
    </div>
  </form>
</div>
