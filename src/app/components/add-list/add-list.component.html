<div>
  @if (isAdding()) {
  <div class="flex flex-col bg-white w-xs border-2 border-green-500">
    <div class="flex justify-center items-center mt-3">
      <textarea
        #myTextArea
        class="w-9/10 h-12 border-2 text-black border-gray-500 focus:border-blue-400 outline-none"
        type="text"
        aria-label="Add new list"
        placeholder="Enter list name"
        [formControl]="newList"
      ></textarea>
    </div>

    <div class="my-2 mx-4">
      <button
        aria-label="Add new list"
        class="w-2/5 h-9 bg-blue-500 text-[14px]"
        (click)="confirmAddList()"
      >
        Add New list
      </button>
      <button
        aria-label="Cancel adding new list"
        class="w-1/5 h-9 text-2xl text-black"
        (click)="cancelAddList()"
      >
        X
      </button>
    </div>
  </div>
  } @else {
  <button
    type="button"
    (click)="addList()"
    class="w-xs h-12 text-lg bg-white text-gray-800 font-semibold rounded-xl shadow-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition"
  >
    + Add New Task
  </button>
  }
</div>
